# 镜像为 linux/amd64。新 Pod 启动会执行 MySQL 迁移，并启动到期和维护任务。
# 如果现有 Manager 仍占用同一数据库，等到切换窗口再启动新副本。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox-service
  namespace: devbox-infra
  labels:
    app: devbox-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devbox-service
  template:
    metadata:
      labels:
        app: devbox-service
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: 8080,8445
    spec:
      volumes:
      - name: relay-client-tls
        secret:
          secretName: devbox-manager-relay-client-tls
          defaultMode: 292
          items:
          - key: tls.crt
            path: client.crt
          - key: tls.key
            path: client.key
      - name: nomad-certs
        secret:
          secretName: devbox-nomad-certs
          defaultMode: 292
          items:
          - key: ca.pem
            path: ca.pem
          - key: client-cert.pem
            path: client-cert.pem
          - key: client-key.pem
            path: client-key.pem
      - name: crypto-beta
        secret:
          secretName: devbox-secret
          defaultMode: 292
          items:
          - key: beta
            path: beta
      - name: server-tls
        secret:
          secretName: devbox-manager-tls
          defaultMode: 292
          items:
          - key: devbox-manager-tls.crt
            path: server.crt
          - key: devbox-manager-tls.key
            path: server.key
      containers:
      - name: devbox-service
        image: swr.cn-south-1.myhuaweicloud.com/cloud_devbox/devbox-service:1.0.0-2026111901.amd64
        ports:
        - name: public-https
          containerPort: 8080
          protocol: TCP
        - name: internal-mtls
          containerPort: 8445
          protocol: TCP
        envFrom:
        - secretRef:
            name: devbox-secret
        env:
        - name: NOMAD_ADDRESS
          value: https://nomad:4646
        - name: MGMT_SERVICE_GRPC_TARGET
          value: mgmt-service:8448
        - name: RELAY_CONTROLLER_GRPC_TARGET
          value: devbridge-service-grpc-8446.devbox-infra.svc.cluster.local:8446
        - name: RELAY_CONTROLLER_SERVER_NAME
          value: nomad
        - name: CLIENT_CA_CERT_PATH
          value: /etc/nomad/tls/ca.pem
        - name: CLIENT_CERT_PATH
          value: /etc/nomad/tls/client-cert.pem
        - name: CLIENT_KEY_PATH
          value: /etc/nomad/tls/client-key.pem
        - name: RELAY_CONTROLLER_CLIENT_CERT_PATH
          value: /etc/relay/tls/client.crt
        - name: RELAY_CONTROLLER_CLIENT_KEY_PATH
          value: /etc/relay/tls/client.key
        - name: CLI_MIN_SUPPORTED_VERSION
          value: 0.0.5-release
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: relay-client-tls
          mountPath: /etc/relay/tls
          readOnly: true
        - name: nomad-certs
          mountPath: /etc/nomad/tls
          readOnly: true
        - name: crypto-beta
          mountPath: /opt/cloud/dog
          readOnly: true
        - name: server-tls
          mountPath: /etc/devbox/tls
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: public-https
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          tcpSocket:
            port: public-https
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 24
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
      - name: default-secret
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600

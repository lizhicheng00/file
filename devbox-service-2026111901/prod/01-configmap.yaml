# 替换生产命名空间及全部 REPLACE_*。以下服务地址、证书 SAN 均填写生产值。
# CLIENT_CA_CERT_PATH 同时供 Nomad、Mgmt、Relay 使用，CA PEM 需包含三者所需的信任链。
# 若生产 Relay 与 Nomad、Mgmt 共用客户端身份，删除 RELAY_CONTROLLER_CLIENT_* 两项及对应卷。
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: replace-prod-namespace
  name: devbox-service-config
data:
  MYSQL_HOST: REPLACE_PROD_MYSQL_HOST
  MYSQL_PORT: '3306'
  MYSQL_DATABASE: REPLACE_PROD_MYSQL_DATABASE
  MYSQL_USER: REPLACE_PROD_MYSQL_USER
  REDIS_HOST: REPLACE_PROD_REDIS_HOST
  REDIS_PORT: '6379'
  NOMAD_ADDRESS: https://REPLACE_PROD_NOMAD_HOST:REPLACE_NOMAD_PORT
  MGMT_SERVICE_GRPC_TARGET: REPLACE_PROD_MGMT_HOST:REPLACE_MGMT_PORT
  MGMT_SERVICE_SERVER_NAME: REPLACE_MGMT_CERT_SAN
  RELAY_CONTROLLER_GRPC_TARGET: REPLACE_PROD_RELAY_HOST:REPLACE_RELAY_PORT
  RELAY_CONTROLLER_SERVER_NAME: REPLACE_RELAY_CERT_SAN
  SANDBOX_PROXY_DOMAIN: REPLACE_PROD_GATEWAY_DOMAIN
  CLIENT_CA_CERT_PATH: /etc/nomad/tls/ca.pem
  CLIENT_CERT_PATH: /etc/nomad/tls/client-cert.pem
  CLIENT_KEY_PATH: /etc/nomad/tls/client-key.pem
  GATEWAY_CLIENT_CA_PATH: /etc/devbox/gateway/ca.pem
  RELAY_CONTROLLER_CLIENT_CERT_PATH: /etc/relay/tls/client.crt
  RELAY_CONTROLLER_CLIENT_KEY_PATH: /etc/relay/tls/client.key
  TLS_CERT_PATH: /etc/devbox/tls/server.crt
  TLS_KEY_PATH: /etc/devbox/tls/server.key

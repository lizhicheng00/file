# 填同一生产命名空间、生产 SWR 镜像和 env 中的 REPLACE_*。已有 devbox-secret 提供数据库配置和解密材料。
# 核对 default-secret 和各证书 Secret 的名称及键。beta 从 devbox-secret 挂载到 /opt/cloud/dog/beta。
# 模板使用 amd64，按实际镜像和节点调整。生产库和凭据核验后把 replicas 调为 1。启动会执行 MySQL 迁移。
# Nomad/Mgmt/Relay 使用同一 CA 信任包。Relay 如共用默认客户端身份，移除两个 RELAY_CONTROLLER_CLIENT_* 环境变量与对应挂载。
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: replace-prod-namespace
  name: devbox-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: devbox-service
  template:
    metadata:
      labels:
        app: devbox-service
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: default-secret
      containers:
      - name: devbox-service
        image: REPLACE_PROD_SWR_IMAGE
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_HOST
        - name: MYSQL_PORT
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_PORT
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: REDIS_PASSWORD
        - name: OMEGA
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: OMEGA
        - name: WORK_KEY
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: WORK_KEY
        - name: NOMAD_ADDRESS
          value: https://REPLACE_PROD_NOMAD_HOST:REPLACE_NOMAD_PORT
        - name: MGMT_SERVICE_GRPC_TARGET
          value: REPLACE_PROD_MGMT_HOST:REPLACE_MGMT_PORT
        - name: MGMT_SERVICE_SERVER_NAME
          value: REPLACE_MGMT_CERT_SAN
        - name: RELAY_CONTROLLER_GRPC_TARGET
          value: REPLACE_PROD_RELAY_HOST:REPLACE_RELAY_PORT
        - name: RELAY_CONTROLLER_SERVER_NAME
          value: REPLACE_RELAY_CERT_SAN
        - name: SANDBOX_PROXY_DOMAIN
          value: REPLACE_PROD_GATEWAY_DOMAIN
        - name: CLIENT_CA_CERT_PATH
          value: /etc/nomad/tls/ca.pem
        - name: CLIENT_CERT_PATH
          value: /etc/nomad/tls/client-cert.pem
        - name: CLIENT_KEY_PATH
          value: /etc/nomad/tls/client-key.pem
        - name: GATEWAY_CLIENT_CA_PATH
          value: /etc/devbox/gateway/ca.pem
        - name: RELAY_CONTROLLER_CLIENT_CERT_PATH
          value: /etc/relay/tls/client.crt
        - name: RELAY_CONTROLLER_CLIENT_KEY_PATH
          value: /etc/relay/tls/client.key
        - name: TLS_CERT_PATH
          value: /etc/devbox/tls/server.crt
        - name: TLS_KEY_PATH
          value: /etc/devbox/tls/server.key
        ports:
        - name: public-https
          containerPort: 8080
        - name: gateway-grpc
          containerPort: 8445
        startupProbe:
          tcpSocket:
            port: gateway-grpc
          periodSeconds: 5
          failureThreshold: 132
        readinessProbe:
          tcpSocket:
            port: gateway-grpc
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: crypto-beta
          mountPath: /opt/cloud/dog
          readOnly: true
        - name: nomad-client-tls
          mountPath: /etc/nomad/tls
          readOnly: true
        - name: server-tls
          mountPath: /etc/devbox/tls
          readOnly: true
        - name: gateway-ca
          mountPath: /etc/devbox/gateway
          readOnly: true
        - name: relay-client-tls
          mountPath: /etc/relay/tls
          readOnly: true
      volumes:
      - name: crypto-beta
        secret:
          secretName: devbox-secret
          defaultMode: 288
          items:
          - key: beta
            path: beta
      - name: nomad-client-tls
        secret:
          secretName: devbox-service-nomad-certs
          defaultMode: 288
          items:
          - key: ca.pem
            path: ca.pem
          - key: client-cert.pem
            path: client-cert.pem
          - key: client-key.pem
            path: client-key.pem
      - name: server-tls
        secret:
          secretName: devbox-service-server-tls
          defaultMode: 288
          items:
          - key: tls.crt
            path: server.crt
          - key: tls.key
            path: server.key
      - name: gateway-ca
        secret:
          secretName: devbox-service-gateway-ca
          defaultMode: 288
          items:
          - key: ca.pem
            path: ca.pem
      - name: relay-client-tls
        secret:
          secretName: devbox-service-relay-client-tls
          defaultMode: 288
          items:
          - key: tls.crt
            path: client.crt
          - key: tls.key
            path: client.key

# 本文件按测试集群的 Nomad、Mgmt 和 Relay 服务命名及证书 SAN 推定生产配置。
# 现有 devbox-secret 提供数据库配置和解密材料。现有各 TLS Secret 提供证书。
# 当前按已确认可用的 amd64 镜像与单副本配置。服务启动会执行 MySQL 迁移。
# Mgmt 独立 TLS 需要先在 devbox-infra 创建 devbox-service-mgmt-client-tls。
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: devbox-infra
  name: devbox-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devbox-service
  template:
    metadata:
      labels:
        app: devbox-service
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: default-secret
      containers:
      - name: devbox-service
        image: swr.cn-south-1.myhuaweicloud.com/cloud_devbox/devbox-service:1.0.0-2026112001.amd64
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_HOST
        - name: MYSQL_PORT
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_PORT
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: MYSQL_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: REDIS_PASSWORD
        - name: OMEGA
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: OMEGA
        - name: WORK_KEY
          valueFrom:
            secretKeyRef:
              name: devbox-secret
              key: WORK_KEY
        - name: NOMAD_ADDRESS
          value: https://nomad:4646
        - name: MGMT_SERVICE_GRPC_TARGET
          value: mgmt-service:8448
        - name: MGMT_SERVICE_SERVER_NAME
          value: nomad
        - name: RELAY_CONTROLLER_GRPC_TARGET
          value: devbridge-service-grpc-8446.devbox-infra.svc.cluster.local:8446
        - name: RELAY_CONTROLLER_SERVER_NAME
          value: nomad
        - name: SANDBOX_PROXY_DOMAIN
          value: devbox-{region}.hwtunnel.com
        - name: CLIENT_CA_CERT_PATH
          value: /etc/nomad/tls/ca.pem
        - name: CLIENT_CERT_PATH
          value: /etc/nomad/tls/client-cert.pem
        - name: CLIENT_KEY_PATH
          value: /etc/nomad/tls/client-key.pem
        - name: GATEWAY_CLIENT_CA_PATH
          value: /etc/devbox/gateway/ca.pem
        - name: RELAY_CONTROLLER_CLIENT_CERT_PATH
          value: /etc/relay/tls/client.crt
        - name: RELAY_CONTROLLER_CLIENT_KEY_PATH
          value: /etc/relay/tls/client.key
        - name: TLS_CERT_PATH
          value: /etc/devbox/tls/server.crt
        - name: TLS_KEY_PATH
          value: /etc/devbox/tls/server.key
        - name: MGMT_SERVICE_CLIENT_CA_CERT_PATH
          value: /etc/devbox/mgmt/ca.pem
        - name: MGMT_SERVICE_CLIENT_CERT_PATH
          value: /etc/devbox/mgmt/client-cert.pem
        - name: MGMT_SERVICE_CLIENT_KEY_PATH
          value: /etc/devbox/mgmt/client-key.pem
        ports:
        - name: public-https
          containerPort: 8080
        - name: gateway-grpc
          containerPort: 8445
        startupProbe:
          tcpSocket:
            port: gateway-grpc
          periodSeconds: 5
          failureThreshold: 132
        readinessProbe:
          tcpSocket:
            port: gateway-grpc
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: crypto-beta
          mountPath: /opt/cloud/dog
          readOnly: true
        - name: nomad-client-tls
          mountPath: /etc/nomad/tls
          readOnly: true
        - name: server-tls
          mountPath: /etc/devbox/tls
          readOnly: true
        - name: gateway-ca
          mountPath: /etc/devbox/gateway
          readOnly: true
        - name: relay-client-tls
          mountPath: /etc/relay/tls
          readOnly: true
        - name: mgmt-client-tls
          mountPath: /etc/devbox/mgmt
          readOnly: true
      volumes:
      - name: crypto-beta
        secret:
          secretName: devbox-secret
          defaultMode: 288
          items:
          - key: beta
            path: beta
      - name: nomad-client-tls
        secret:
          secretName: devbox-service-nomad-certs
          defaultMode: 288
          items:
          - key: ca.pem
            path: ca.pem
          - key: client-cert.pem
            path: client-cert.pem
          - key: client-key.pem
            path: client-key.pem
      - name: server-tls
        secret:
          secretName: devbox-service-server-tls
          defaultMode: 288
          items:
          - key: tls.crt
            path: server.crt
          - key: tls.key
            path: server.key
      - name: gateway-ca
        secret:
          secretName: devbox-service-gateway-ca
          defaultMode: 288
          items:
          - key: ca.pem
            path: ca.pem
      - name: relay-client-tls
        secret:
          secretName: devbox-service-relay-client-tls
          defaultMode: 288
          items:
          - key: tls.crt
            path: client.crt
          - key: tls.key
            path: client.key
      - name: mgmt-client-tls
        secret:
          secretName: devbox-service-mgmt-client-tls
          defaultMode: 288
          items:
          - key: ca.pem
            path: ca.pem
          - key: client-cert.pem
            path: client-cert.pem
          - key: client-key.pem
            path: client-key.pem

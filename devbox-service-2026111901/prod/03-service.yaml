# 替换生产命名空间。集群内 HTTPS 8080 和 Gateway mTLS gRPC 8445。
apiVersion: v1
kind: Service
metadata:
  namespace: replace-prod-namespace
  name: devbox-service
spec:
  type: ClusterIP
  selector:
    app: devbox-service
  ports:
  - name: public-https
    port: 8080
    targetPort: public-https
  - name: gateway-grpc
    port: 8445
    targetPort: gateway-grpc

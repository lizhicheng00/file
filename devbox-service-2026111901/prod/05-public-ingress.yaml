# 仅在需要新建生产 API Ingress 时使用。替换生产 ELB ID、证书 ID、域名和命名空间。
# 若已有共享 443 Ingress，只迁移这四条 DevBox 路径的后端，保留原 TLS 策略及 Relay/Mgmt 等规则。
# 入口为 HTTPS 443，后端也用 HTTPS，指向 devbox-service:8080。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devbox-service-public-443
  namespace: replace-prod-namespace
  annotations:
    kubernetes.io/elb.class: performance
    kubernetes.io/elb.id: REPLACE_PROD_PUBLIC_ELB_ID
    kubernetes.io/elb.port: '443'
    kubernetes.io/elb.pool-protocol: https
    kubernetes.io/elb.tls-certificate-ids: REPLACE_PROD_ELB_SERVER_CERT_IDS
    kubernetes.io/elb.tls-ciphers-policy: tls-1-2
    kubernetes.io/elb.x-forwarded-port: 'true'
spec:
  ingressClassName: cce
  rules:
  - host: replace-prod-api-domain.example
    http:
      paths:
      - path: /templates
        pathType: ImplementationSpecific
        backend:
          service:
            name: devbox-service
            port:
              number: 8080
        property:
          ingress.beta.kubernetes.io/url-match-mode: STARTS_WITH
      - path: /v2/templates
        pathType: ImplementationSpecific
        backend:
          service:
            name: devbox-service
            port:
              number: 8080
        property:
          ingress.beta.kubernetes.io/url-match-mode: STARTS_WITH
      - path: /sandboxes
        pathType: ImplementationSpecific
        backend:
          service:
            name: devbox-service
            port:
              number: 8080
        property:
          ingress.beta.kubernetes.io/url-match-mode: STARTS_WITH
      - path: /v2/sandboxes
        pathType: ImplementationSpecific
        backend:
          service:
            name: devbox-service
            port:
              number: 8080
        property:
          ingress.beta.kubernetes.io/url-match-mode: STARTS_WITH
